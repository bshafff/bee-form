<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d5016">
    <title>Form Kunjungan Lebah - GH 1</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2c 100%);
            min-height: 100vh;
            padding: 16px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2c 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .connection-status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .connection-status.online {
            background: rgba(76, 175, 80, 0.3);
            color: #fff;
        }

        .connection-status.offline {
            background: rgba(244, 67, 54, 0.3);
            color: #fff;
        }

        .content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d5016;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .bays-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .bays-section h3 {
            color: #2d5016;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .bay-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .bay-label {
            font-weight: 600;
            color: #2d5016;
            min-width: 50px;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 4px;
        }

        .counter button {
            width: 32px;
            height: 32px;
            border: none;
            background: #2d5016;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-weight: bold;
        }

        .counter button:active {
            background: #1f3810;
            transform: scale(0.95);
        }

        .counter button:hover {
            background: #3d6b1e;
        }

        .counter-value {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #2d5016;
            font-size: 16px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .actions button:nth-child(3) {
            grid-column: 1 / -1;
        }

        button.btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.btn-submit {
            background: #2d5016;
            color: white;
        }

        button.btn-submit:active {
            transform: scale(0.98);
        }

        button.btn-submit:hover {
            background: #1f3810;
        }

        button.btn-reset {
            background: #f0f0f0;
            color: #666;
        }

        button.btn-reset:hover {
            background: #e0e0e0;
        }

        button.btn-delete {
            background: #dc3545;
            color: white;
            grid-column: 1 / -1;
        }

        button.btn-delete:hover {
            background: #c82333;
        }

        button.btn-delete:active {
            transform: scale(0.98);
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: white;
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            border: none;
            background: transparent;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            position: relative;
        }

        .tab-btn.active {
            color: #2d5016;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #2d5016;
        }

        .tab-btn:hover {
            background: #f9f9f9;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .kotak-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .kotak-label {
            font-weight: 600;
            color: #2d5016;
            min-width: 100px;
        }

        .kotak-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kotak-input-group input {
            width: 70px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
        }

        .kotak-input-group .unit {
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="headerTitle">🐝 Kunjungan Lebah</h1>
            <p>PT. Agri Wangi Berry - Pantau Rate Polinasi</p>
            <div id="connectionStatus" class="connection-status online">
                <span id="statusText">🟢 Online</span>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-kunjungan">Kunjungan</button>
            <button class="tab-btn" data-tab="tab-mortalitas">Mortalitas</button>
        </div>

        <div class="content">
            <!-- TAB 1: Kunjungan Lebah -->
            <div id="tab-kunjungan" class="tab-content active">
                <form id="beeForm">
                    <!-- Basic Info -->
                    <div class="form-group">
                        <label for="tanggal">Tanggal</label>
                        <input type="date" id="tanggal" required>
                    </div>

                    <div class="row-inputs">
                        <div class="form-group">
                            <label for="waktu">Waktu</label>
                            <input type="time" id="waktu" required>
                        </div>
                        <div class="form-group">
                            <label for="gh">Greenhouse</label>
                            <select id="gh" required>
                                <option value="">-- Pilih GH --</option>
                                <option value="GH 1">GH 1</option>
                                <option value="GH 2">GH 2</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rowKe">Row Ke</label>
                        <input type="number" id="rowKe" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="cuaca">Cuaca</label>
                        <select id="cuaca" required>
                            <option value="">-- Pilih Cuaca --</option>
                            <option value="cerah">Cerah</option>
                            <option value="berawan">Berawan</option>
                            <option value="mendung">Mendung</option>
                            <option value="hujan">Hujan</option>
                            <option value="gerimis">Gerimis</option>
                        </select>
                    </div>

                    <!-- Bays Counter -->
                    <div class="bays-section">
                        <h3>Jumlah Kunjungan per Bay</h3>
                        <div id="baysList"></div>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <button type="button" class="btn btn-reset" onclick="resetFormKunjungan()">Reset</button>
                        <button type="submit" class="btn btn-submit">Kirim ke Sheet</button>
                        <button type="button" class="btn btn-delete" onclick="deleteDataKunjungan()">Hapus Terakhir</button>
                    </div>

                    <div id="status" class="status"></div>
                </form>
            </div>

            <!-- TAB 2: Mortalitas -->
            <div id="tab-mortalitas" class="tab-content">
                <form id="mortalitasForm">
                    <!-- Basic Info -->
                    <div class="form-group">
                        <label for="tanggal2">Tanggal</label>
                        <input type="date" id="tanggal2" required>
                    </div>

                    <div class="row-inputs">
                        <div class="form-group">
                            <label for="waktu2">Waktu</label>
                            <input type="time" id="waktu2" required>
                        </div>
                        <div class="form-group">
                            <label for="gh2">Greenhouse</label>
                            <select id="gh2" required>
                                <option value="">-- Pilih GH --</option>
                                <option value="GH 1">GH 1</option>
                                <option value="GH 2">GH 2</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cuaca2">Cuaca</label>
                        <select id="cuaca2" required>
                            <option value="">-- Pilih Cuaca --</option>
                            <option value="cerah">Cerah</option>
                            <option value="berawan">Berawan</option>
                            <option value="mendung">Mendung</option>
                            <option value="hujan">Hujan</option>
                            <option value="gerimis">Gerimis</option>
                        </select>
                    </div>

                    <!-- Kotak Lebah Counter -->
                    <div class="bays-section">
                        <h3>Persentase Lebah Hidup per Kotak</h3>
                        <div id="kotakList"></div>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <button type="button" class="btn btn-reset" onclick="resetFormMortalitas()">Reset</button>
                        <button type="submit" class="btn btn-submit">Kirim ke Sheet</button>
                        <button type="button" class="btn btn-delete" onclick="deleteDataMortalitas()">Hapus Terakhir</button>
                    </div>

                    <div id="statusMortalitas" class="status"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ===== KONFIGURASI: tempel URL deployment Apps Script kamu di sini =====
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby1c5bUtyIE4zXMEky_xjP3DXxeEQbYLVbQDlhvKzZRerwWJWQLIVx8z-nSyR3U1eRZqw/exec';

        // ===== OFFLINE-FIRST DB =====
        let db;
        const dbName = 'BeeFormDB';
        const storeName = 'formQueue';

        // Initialize IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(storeName)) {
                        database.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        // Save data to queue
        async function saveToQueue(data, type) {
            try {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                store.add({
                    data: data,
                    type: type,
                    timestamp: new Date().toISOString(),
                    synced: false
                });
            } catch (error) {
                console.error('Error saving to queue:', error);
            }
        }

        // Get all queued data
        async function getQueuedData() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        // Delete from queue
        async function deleteFromQueue(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.delete(id);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve();
            });
        }

        // Sync all queued data
        async function syncQueuedData() {
            const queued = await getQueuedData();
            
            for (const item of queued) {
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(item.data)
                    });
                    
                    await deleteFromQueue(item.id);
                    console.log('Synced:', item.data);
                } catch (error) {
                    console.error('Sync error:', error);
                    break; // Stop if one fails
                }
            }
        }

        // ===== CONNECTION STATUS =====
        function updateConnectionStatus() {
            const status = navigator.onLine;
            const statusEl = document.getElementById('connectionStatus');
            const statusText = document.getElementById('statusText');
            
            if (status) {
                statusEl.classList.remove('offline');
                statusEl.classList.add('online');
                statusText.textContent = '🟢 Online';
                syncQueuedData(); // Try to sync when online
            } else {
                statusEl.classList.remove('online');
                statusEl.classList.add('offline');
                statusText.textContent = '🔴 Offline - Data tersimpan lokal';
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Set today's date as default
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('tanggal').value = today;
        document.getElementById('tanggal2').value = today;

        // Init DB and check connection
        initDB().then(() => {
            updateConnectionStatus();
            console.log('Database initialized');
        }).catch(err => console.error('DB init failed:', err));

        // ===== TAB NAVIGATION =====
        document.querySelector('.tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            const tabName = btn.dataset.tab;
            if (!tabName) return;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            btn.classList.add('active');
            const content = document.getElementById(tabName);
            if (content) content.classList.add('active');
        });

        // ===== TAB 1: KUNJUNGAN LEBAH =====
        const baysList = document.getElementById('baysList');
        const bays = {};

        for (let i = 1; i <= 10; i++) {
            bays[`bay${i}`] = 0;

            const bayItem = document.createElement('div');
            bayItem.className = 'bay-item';
            bayItem.innerHTML = `
                <span class="bay-label">Bay ${i}</span>
                <div class="counter">
                    <button type="button" onclick="decrementBay('bay${i}')">−</button>
                    <div class="counter-value" id="value-bay${i}">0</div>
                    <button type="button" onclick="incrementBay('bay${i}')">+</button>
                </div>
            `;
            baysList.appendChild(bayItem);
        }

        function incrementBay(bayId) {
            bays[bayId]++;
            updateBayDisplay(bayId);
        }

        function decrementBay(bayId) {
            if (bays[bayId] > 0) {
                bays[bayId]--;
            }
            updateBayDisplay(bayId);
        }

        function updateBayDisplay(bayId) {
            document.getElementById(`value-${bayId}`).textContent = bays[bayId];
        }

        // Form submission - Kunjungan
        document.getElementById('beeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                sheet: 'kunjungan',
                tanggal: document.getElementById('tanggal').value,
                waktu: document.getElementById('waktu').value,
                gh: document.getElementById('gh').value,
                rowKe: document.getElementById('rowKe').value,
                cuaca: document.getElementById('cuaca').value,
                ...bays
            };

            try {
                if (navigator.onLine) {
                    // Online - send directly
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(formData)
                    });

                    showStatus('Data berhasil dikirim! ✓', 'success');
                } else {
                    // Offline - save to queue
                    await saveToQueue(formData, 'kunjungan');
                    showStatus('Offline - Data tersimpan lokal, akan dikirim otomatis saat online', 'success');
                }
                
                resetFormKunjungan();
            } catch (error) {
                console.error('Error:', error);
                // Still save to queue on error
                await saveToQueue(formData, 'kunjungan');
                showStatus('Koneksi gagal - Data tersimpan lokal, akan dikirim saat online', 'success');
                resetFormKunjungan();
            }
        });

        function resetFormKunjungan() {
            document.getElementById('beeForm').reset();
            Object.keys(bays).forEach(bay => {
                bays[bay] = 0;
                updateBayDisplay(bay);
            });
            document.getElementById('tanggal').value = today;
            hideStatus();
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function hideStatus() {
            document.getElementById('status').className = 'status';
        }

        async function deleteDataKunjungan() {
            if (!confirm('Hapus data terakhir dari sheet Kunjungan? Tindakan ini tidak bisa dibatalkan.')) {
                return;
            }

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ method: 'delete', sheet: 'kunjungan' })
                });

                showStatus('Data terakhir berhasil dihapus! ✓', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus('Gagal menghapus data. Periksa koneksi internet.', 'error');
            }
        }

        // ===== TAB 2: MORTALITAS =====
        const kotakList = document.getElementById('kotakList');
        const kotaks = {};

        for (let i = 1; i <= 6; i++) {
            kotaks[`kotak${i}`] = 100;

            const kotakItem = document.createElement('div');
            kotakItem.className = 'kotak-item';
            kotakItem.innerHTML = `
                <span class="kotak-label">Kotak Lebah ${i}</span>
                <div class="kotak-input-group">
                    <input type="number" id="kotak${i}" min="0" max="100" value="100" onchange="updateKotakValue('kotak${i}')">
                    <span class="unit">%</span>
                </div>
            `;
            kotakList.appendChild(kotakItem);
        }

        function updateKotakValue(kotakId) {
            const input = document.getElementById(kotakId);
            let val = parseInt(input.value) || 0;
            
            // Clamp between 0 dan 100
            if (val < 0) val = 0;
            if (val > 100) val = 100;
            
            input.value = val;
            kotaks[kotakId] = val;
        }

        // Form submission - Mortalitas
        document.getElementById('mortalitasForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                sheet: 'mortalitas',
                tanggal: document.getElementById('tanggal2').value,
                waktu: document.getElementById('waktu2').value,
                gh: document.getElementById('gh2').value,
                cuaca: document.getElementById('cuaca2').value,
                ...kotaks
            };

            try {
                if (navigator.onLine) {
                    // Online - send directly
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(formData)
                    });

                    showStatusMortalitas('Data berhasil dikirim! ✓', 'success');
                } else {
                    // Offline - save to queue
                    await saveToQueue(formData, 'mortalitas');
                    showStatusMortalitas('Offline - Data tersimpan lokal, akan dikirim otomatis saat online', 'success');
                }
                
                resetFormMortalitas();
            } catch (error) {
                console.error('Error:', error);
                // Still save to queue on error
                await saveToQueue(formData, 'mortalitas');
                showStatusMortalitas('Koneksi gagal - Data tersimpan lokal, akan dikirim saat online', 'success');
                resetFormMortalitas();
            }
        });

        function resetFormMortalitas() {
            document.getElementById('mortalitasForm').reset();
            Object.keys(kotaks).forEach(kotak => {
                kotaks[kotak] = 100;
                document.getElementById(kotak).value = 100;
            });
            document.getElementById('tanggal2').value = today;
            hideStatusMortalitas();
        }

        function showStatusMortalitas(message, type) {
            const status = document.getElementById('statusMortalitas');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function hideStatusMortalitas() {
            document.getElementById('statusMortalitas').className = 'status';
        }

        async function deleteDataMortalitas() {
            if (!confirm('Hapus data terakhir dari sheet Mortalitas? Tindakan ini tidak bisa dibatalkan.')) {
                return;
            }

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ method: 'delete', sheet: 'mortalitas' })
                });

                showStatusMortalitas('Data terakhir berhasil dihapus! ✓', 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatusMortalitas('Gagal menghapus data. Periksa koneksi internet.', 'error');
            }
        }

        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed'));
        }
    </script>
</body>
</html>
